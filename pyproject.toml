[project]
name = "augmentic-accounting-site"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
	"fastapi==0.116.1",
	"uvicorn[standard]==0.35.0",
	"markdown==3.9",
	"python-frontmatter==1.1.0",
	"python-slugify==8.0.4",
	"jinja2==3.1.6",
]

[dependency-groups]
dev = [
	"httpx==0.28.1",
	"pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
